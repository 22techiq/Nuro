<h2>Pending Comments</h2>
<div id="pending"></div>

<script>
const API="https://script.google.com/macros/s/AKfycbyU5BzlCmJkLTGR6yyGQwZ3LAPBEvnSvySChcPxqLT02p1OOSUHOg7qjDZIAhLjzSg3/exec";

fetch(API+"?action=pendingComments")
.then(r=>r.json())
.then(data=>{
  const box=document.getElementById("pending");
  data.forEach(c=>{
    box.innerHTML+=`
      <div>
        <p>${c[2]}: ${c[3]}</p>
        <button onclick="mod('${c[0]}','approved')">Approve</button>
        <button onclick="mod('${c[0]}','rejected')">Reject</button>
      </div>
    `;
  });
});

function mod(id,status){
  fetch(API,{
    method:"POST",
    body:JSON.stringify({
      action:"moderateComment",
      comment_id:id,
      status:status
    })
  }).then(()=>location.reload());
}
</script>
