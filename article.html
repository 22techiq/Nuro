<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Article</title>
<style>
body{font-family:Arial;margin:0;padding:20px;background:#f4f4f4}
.card{background:#fff;padding:20px;border-radius:6px}
textarea{width:100%;height:100px}
button{padding:10px;background:#cc0000;color:#fff;border:none}
</style>
</head>
<body>

<div class="card">
<h1 id="title"></h1>
<img id="image" width="100%">
<p id="content"></p>

<h3>Comments</h3>
<div id="comments"></div>

<textarea id="commentBox"></textarea>
<button onclick="postComment()">Post Comment</button>
</div>

<script>
const API="    https://script.google.com/macros/s/AKfycbx0WQQF0K-OScs7Sap1Lx_YY8PT-OU7KRC8GjmddJWeKrYvHeAp4la53sA1A7rWRUaB/exec";
const slug=new URLSearchParams(location.search).get("slug");

fetch(API+"?action=getArticle&slug="+slug)
.then(r=>r.json())
.then(a=>{
title.innerText=a[1];
image.src=a[5];
content.innerText=a[3];
});

fetch(API+"?action=getComments&slug="+slug)
.then(r=>r.json())
.then(d=>{
comments.innerHTML=d.map(c=>`
<p><b>${c.user}</b>: ${c.comment}</p>
`).join("");
});

function postComment(){
const token=localStorage.getItem("token");
if(!token){alert("Login required");return;}

fetch(API,{
method:"POST",
body:JSON.stringify({
action:"postComment",
token:token,
slug:slug,
comment:commentBox.value
})
})
.then(r=>r.json())
.then(res=>{
alert("Submitted for approval");
});
}
</script>

</body>
</html>
