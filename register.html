<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Register</title></head>
<body>

<h2>Register</h2>
<input id="name" placeholder="Name"><br>
<input id="email" placeholder="Email"><br>
<input id="password" type="password" placeholder="Password"><br>
<button onclick="register()">Register</button>

<script>
const API="https://script.google.com/macros/s/AKfycbxlDncSsQZSXJrJ6-dttceneARoV6lshz39ZJ4fTSNzvfmG_3fYW10_kQ5qqgpUvQkb/exec";

function register(){
fetch(API,{
method:"POST",
body:JSON.stringify({
action:"register",
name:name.value,
email:email.value,
password:password.value
})
})
.then(r=>r.json())
.then(d=>{
if(d.success){
alert("Registered");
location.href="login.html";
}
});
}
</script>

</body>
</html>
