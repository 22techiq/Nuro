<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>Login</title></head>
<body>

<h2>Login</h2>
<input id="email" placeholder="Email"><br>
<input id="password" type="password" placeholder="Password"><br>
<button onclick="login()">Login</button>

<script>
const API="https://script.google.com/macros/s/AKfycbxlDncSsQZSXJrJ6-dttceneARoV6lshz39ZJ4fTSNzvfmG_3fYW10_kQ5qqgpUvQkb/exec";

function login(){
fetch(API,{
method:"POST",
body:JSON.stringify({
action:"login",
email:email.value,
password:password.value
})
})
.then(r=>r.json())
.then(d=>{
if(d.token){
localStorage.setItem("token",d.token);
alert("Logged in");
location.href="index.html";
}else alert("Invalid");
});
}
</script>

</body>
</html>
